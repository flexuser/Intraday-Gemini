name: Bootstrap Intraday Forecast History

on:
  workflow_dispatch:

concurrency:
  group: intraday-history-bootstrap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build causal observations from recent five-minute history
        run: python -m muthoot_poc.bootstrap_intraday_history

      - name: Commit bootstrap history and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data_store/intraday_training_history.json public/data_store/intraday_model.json public/data_store/intraday_backtest_report.json
          if git diff --staged --quiet; then
            echo "No intraday history changes."
            exit 0
          fi
          git commit -m "auto: bootstrap intraday forecast history [skip ci]"
          git push
