name: Intraday Live Market Sync

on:
  schedule:
    # Indian Market Hours: 09:15 AM - 03:30 PM IST (Mon-Fri)
    # UTC Equivalents: 03:45 UTC - 10:00 UTC
    - cron: '45 3 * * 1-5'      # 09:15 IST (Market Open)
    - cron: '*/15 4-9 * * 1-5'  # Every 15 mins from 09:30 IST to 15:15 IST
    - cron: '0 10 * * 1-5'      # 15:30 IST (Market Close)
  workflow_dispatch:            # Enables "Run workflow" button in GitHub UI for manual testing

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Intraday Data Fetcher
        run: |
          python -m muthoot_poc.archive_once

      - name: Commit and Push Updated Market JSONs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data_store/*.json
          if git diff --staged --quiet; then
            echo "No new market data points to commit."
          else
            git commit -m "auto: sync live intraday market curves [skip ci]"
            git push
          fi