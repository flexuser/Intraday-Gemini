name: Intraday AI Sync Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-intraday-sync]

concurrency:
  group: intraday-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Intraday AI Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m muthoot_poc.archive_once

      - name: Commit & Push Updated Data Store
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase
          
          git add public/data_store/
          
          if git diff --staged --quiet; then
            echo "No data store changes detected. Skipping push."
          else
            git commit -m "auto: sync intraday prediction curves [5m cycle] [skip ci]"
            git push origin main
          fi
