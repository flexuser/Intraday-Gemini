# intraday_tracker_4.yml
name: Intraday AI Sync Pipeline

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Bypass the market-hours guard (testing only)"
        type: boolean
        default: false
  repository_dispatch:
    types: [run-intraday-sync]

concurrency:
  group: intraday-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Intraday AI Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force_run }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}   # optional: Slack/Discord webhook
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}           # optional: healthchecks.io ping
        run: python -m muthoot_poc.archive_once

      - name: Commit & Push Updated Data Store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data_store/
          if git diff --staged --quiet; then
            echo "No data store changes. Nothing to push."
            exit 0
          fi

          # Commit FIRST, then rebase: `git pull --rebase` refuses to run on a dirty working tree.
          git commit -m "auto: sync intraday prediction curves [5m cycle] [skip ci]"
          for attempt in 1 2 3; do
            # -X theirs = on a data-file conflict, keep this run's freshly generated files
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1