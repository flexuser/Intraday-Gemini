name: Intraday AI Sync Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-intraday-sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Intraday AI Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m muthoot_poc.archive_once

      - name: Commit & Push Updated Data Store
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data_store/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: sync intraday prediction curves [5m cycle] [skip ci]" && git push)
