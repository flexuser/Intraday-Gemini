name: Train Intraday Forecast Model

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1-5' # 16:45 IST, after the regular NSE session

concurrency:
  group: intraday-model-train
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train from scored five-minute observations
        run: python -m muthoot_poc.intraday_model

      - name: Commit model evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data_store/intraday_model.json public/data_store/intraday_backtest_report.json
          if git diff --staged --quiet; then
            echo "No intraday model changes."
            exit 0
          fi
          git commit -m "auto: train intraday forecast model [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || true
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
