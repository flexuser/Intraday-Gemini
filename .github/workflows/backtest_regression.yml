name: Strategy Backtest Regression Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 6' # Weekly scheduled run on Saturday at 02:00 UTC

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pydantic scikit-learn

      - name: Run Historical Backtest Harness
        run: |
          python -m muthoot_poc.backtest_harness