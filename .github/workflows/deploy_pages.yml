name: Deploy Public Directory to GitHub Pages

# The dashboard reads live data from raw.githubusercontent.com, so Pages only needs to be
# redeployed when the front-end itself changes (bot data commits are [skip ci] anyway).
on:
  push:
    branches: ["main"]
    paths:
      - "public/index.html"
      - "public/manifest.json"
      - "public/sw.js"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
