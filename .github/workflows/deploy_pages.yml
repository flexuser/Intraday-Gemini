name: Deploy Public Directory to GitHub Pages

on:
  push:
    branches: ["main"]
  # Optional: allow running after intraday/daily archive workflows
  workflow_run:
    workflows: ["Daily Archive", "Intraday Tracker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'  # Tells Pages to publish the public directory as root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4