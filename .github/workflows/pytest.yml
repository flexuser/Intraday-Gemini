name: Offline Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: unit-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run offline archive_once tests
        env:
          # Tests monkeypatch network/LLM; no real keys required
          GEMINI_API_KEY: test-key-not-used
        run: |
          # Accept either repo-root or tests/ layout
          if [ -f test_archive_once.py ]; then
            pytest -q test_archive_once.py
          elif [ -f tests/test_archive_once.py ]; then
            pytest -q tests/test_archive_once.py
          else
            echo "No test_archive_once.py found — skip"
            exit 0
          fi
