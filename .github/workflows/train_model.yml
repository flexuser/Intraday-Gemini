name: Train Quant Model

# Re-validates and retrains the quantitative model on ~10 years of daily data.
# The verdict (did the model earn the right to publish a forecast?) appears on this run's summary page.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 6'     # Saturdays 08:00 IST

concurrency:
  group: model-train
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Walk-forward validation and training
        shell: bash
        run: |
          python -m muthoot_poc.backtest | tee backtest_summary.txt
          { echo '### Quant model validation'; echo '```'; cat backtest_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit & Push Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data_store/quant_model.json public/data_store/backtest_report.json
          if git diff --staged --quiet; then
            echo "No model changes."
            exit 0
          fi
          git commit -m "auto: retrain quant model [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
