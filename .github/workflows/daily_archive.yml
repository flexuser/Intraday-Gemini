name: Daily Intraday AI Pipeline

on:
  schedule:
    # Runs Mon-Fri at 03:40 PM IST (10:10 AM UTC) for final market close audit
    - cron: '10 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Archive Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m muthoot_poc.archive_once

      - name: Commit and Push Updated Data Store
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data_store/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily predictions [skip ci]" && git push)
