name: Daily Intraday AI Pipeline

on:
  schedule:
    # Runs Mon-Fri at 09:30 AM IST (04:00 AM UTC)
    - cron: '0 4 * * 1-5'
    # Runs Mon-Fri at 03:35 PM IST (10:05 AM UTC)
    - cron: '5 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Archive Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m muthoot_poc.archive_once

      - name: Commit and Push Updated Data Store
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data_store/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily predictions and market curves" && git push)
