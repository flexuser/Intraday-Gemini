name: Automated Market Data Ingestion & Prediction Engine

on:
  schedule:
    # Runs every 5 minutes from 03:00 UTC to 10:00 UTC (8:30 AM to 3:30 PM IST), Mon-Fri
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  ingest-and-predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install install yfinance requests pandas numpy pytz google-genai scipy

      - name: Execute Multi-Stock Archiving Pass
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m muthoot_poc.archive_once

      - name: Commit Updated Market Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data_store/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data [skip ci]" && git push)
